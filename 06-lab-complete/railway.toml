# Railway: build bằng Dockerfile, kiểm tra sức khoẻ qua /health.
# Biến môi trường (AGENT_API_KEY, REDIS_URL...) đặt trên dashboard hoặc `railway variables`,
# không ghi trong file này. Railway tự cấp PORT; CMD của Dockerfile đã đọc ${PORT}.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
