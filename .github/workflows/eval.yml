# Quality gate (Exercise 7.3): chạy eval trên golden dataset, fail PR nếu accuracy < 85%.
# run_eval.py trả exit code 1 khi accuracy < --min-accuracy hoặc có regression → job đỏ → chặn merge
# (bật "Require status checks to pass" cho check này trong branch protection).
name: quality-gate
on:
  pull_request:
  workflow_dispatch:   # cho phép chạy tay (gh workflow run) để kiểm tra job
jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Run agent + eval
        working-directory: 06-lab-complete/benchmark-observability/develop
        run: |
          pip install -r requirements.txt
          AGENT_VERSION=v2 MOCK_ERROR_RATE=0 MOCK_SLOW_RATE=0 PORT=8000 python app.py &
          sleep 3
          python eval/run_eval.py --url http://localhost:8000 --min-accuracy 0.85
